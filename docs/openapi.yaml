openapi: 3.0.3
info:
  title: Settl API
  description: Personal + group finance tracker API
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.settl.app
    description: Production

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/groups:
    post:
      summary: Create a group
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
    get:
      summary: List groups for the current user
      operationId: listGroups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"

  /api/v1/groups/{groupID}:
    get:
      summary: Get group details
      operationId: getGroup
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /api/v1/groups/{groupID}/members:
    post:
      summary: Add a member to a group
      operationId: addGroupMember
      parameters:
        - name: groupID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added

  /api/v1/expenses:
    post:
      summary: Create an expense with splits
      operationId: createExpense
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
    get:
      summary: List expenses (filterable)
      operationId: listExpenses
      parameters:
        - name: groupID
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"

  /api/v1/expenses/{expenseID}:
    get:
      summary: Get expense details with splits
      operationId: getExpense
      parameters:
        - name: expenseID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Expense details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"

  /api/v1/balances:
    get:
      summary: Get net balances for the current user
      operationId: getBalances
      parameters:
        - name: groupID
          in: query
          schema:
            type: string
            format: uuid
        - name: personID
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Net balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalancesResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: settl-api

    Group:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_number:
          type: string
          example: GRP-0001
        currency:
          type: string
          default: INR
        created_at:
          type: string
          format: date-time
        member_count:
          type: integer

    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        currency:
          type: string
          default: INR

    AddMemberRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid

    Expense:
      type: object
      properties:
        id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          nullable: true
        payer_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        currency:
          type: string
        fx_rate:
          type: number
          format: float
        category:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        receipt_url:
          type: string
          nullable: true
        splits:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseSplit"

    ExpenseSplit:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        split_type:
          type: string
          enum:
            - equal
            - exact
            - percentage
            - shares
        share_amount:
          type: number
          format: float
          nullable: true
        share_count:
          type: integer
          nullable: true

    CreateExpenseRequest:
      type: object
      required:
        - payer_id
        - amount
        - splits
      properties:
        group_id:
          type: string
          format: uuid
          nullable: true
        payer_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        currency:
          type: string
          default: INR
        fx_rate:
          type: number
          format: float
          default: 1.0
        category:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        splits:
          type: array
          items:
            $ref: "#/components/schemas/CreateSplitItem"

    CreateSplitItem:
      type: object
      required:
        - user_id
        - split_type
      properties:
        user_id:
          type: string
          format: uuid
        split_type:
          type: string
          enum:
            - equal
            - exact
            - percentage
            - shares
        share_amount:
          type: number
          format: float
          nullable: true
        share_count:
          type: integer
          nullable: true

    BalancesResponse:
      type: object
      properties:
        total_owed:
          type: number
          format: float
          description: Total amount others owe this user
        total_owing:
          type: number
          format: float
          description: Total amount this user owes others
        net:
          type: number
          format: float
          description: net = total_owed - total_owing
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/BalanceEntry"

    BalanceEntry:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        group_id:
          type: string
          format: uuid
          nullable: true
        group_name:
          type: string
          nullable: true
        amount:
          type: number
          format: float
        currency:
          type: string
